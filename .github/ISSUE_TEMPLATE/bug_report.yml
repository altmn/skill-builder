name: Bug report
description: Report a reproducible package or workflow problem using synthetic inputs.
body:
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Package version/hash, host/version, Python and operating system. Omit secrets and private paths.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Commands or steps with a small synthetic input. Include expected and actual results.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report
      options:
        - label: This report contains no confidential inputs, credentials or vulnerability details.
          required: true
