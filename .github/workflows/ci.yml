name: Local contracts
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: local-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  standard-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0
      - name: Set up minimum core Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
      - name: Check create and audit propagation review
        run: python3 -I -B -S tools/check_workflow_impact.py --ci
      - name: Check core project and package contracts without site packages
        run: |
          python3 -I -B -S tools/check_git_inventory.py
          python3 -I -B -S tools/check_project.py
          python3 -I -B -S -m unittest discover -s tests -p test_workflow_impact.py -v
          python3 -I -B -S -m unittest discover -s tests -p test_evaluation.py -v
          python3 -I -B -S -m unittest discover -s tests -p test_uber_workflows.py -v
          python3 -I -B -S -m unittest discover -s tests -p test_release.py -v
          python3 -I -B -S -m unittest discover -s tests -p test_plugin.py -v
      - name: Build and inspect all release archives
        run: python3 -I -B -S tools/build_release.py --output "${{ runner.temp }}/skill-builder-release"
  optional-validators:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - name: Set up minimum full-validation Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Create explicit validation environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -I -m pip install --disable-pip-version-check -r requirements-validation.txt
      - name: Check with validation dependencies
        run: |
          .venv/bin/python -I -B tools/check_project.py --require-validators
          .venv/bin/python -I -B -m unittest discover -s tests -v
      - name: Set up current stable Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"
          check-latest: true
      - name: Check current stable Python in a separate environment
        run: |
          python3 -m venv .venv-current
          .venv-current/bin/python -I -m pip install --disable-pip-version-check -r requirements-validation.txt
          .venv-current/bin/python -I -B tools/check_project.py --require-validators
          .venv-current/bin/python -I -B -m unittest discover -s tests -v
